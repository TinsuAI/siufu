version: '3.8'

services:
  # PostgreSQL 18.0 Database
  postgres:
    image: postgres:18.0-alpine
    container_name: siufu-postgres
    environment:
      POSTGRES_DB: customs_db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "8781:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - siufu-network

  # Redis 7.4.1 Cache & Message Broker
  redis:
    image: redis:7.4.1-alpine
    container_name: siufu-redis
    volumes:
      - redis-data:/data
    ports:
      - "8782:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - siufu-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: siufu-backend
    ports:
      - "8780:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/customs_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - uploaded-files:/app/data/uploads
      - exports:/app/data/exports
      - screenshots:/app/data/screenshots
      - ./secrets/gcp-sa-key.json:/app/secrets/gcp-sa-key.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - siufu-network

  # Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: siufu-celery-worker
    command: celery -A src.core.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/customs_db
      CELERY_BROKER_URL: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploaded-files:/app/data/uploads
      - exports:/app/data/exports
      - ./secrets/gcp-sa-key.json:/app/secrets/gcp-sa-key.json:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.core.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - siufu-network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: siufu-frontend
    ports:
      - "8779:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - siufu-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  uploaded-files:
    driver: local
  exports:
    driver: local
  screenshots:
    driver: local

networks:
  siufu-network:
    driver: bridge
