[pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Load plugin to mock external dependencies before imports
plugins = tests.pytest_plugin

# Async support
asyncio_mode = auto

# Custom markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may use database/external services)
    slow: Slow tests (skip with -m "not slow")

# Coverage settings
[coverage:run]
source = src
omit =
    */tests/*
    */migrations/*
    */__pycache__/*

[coverage:report]
# Target: 70%+ for critical paths
precision = 2
show_missing = True
skip_covered = False

# Exclude lines from coverage
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

# Output options
[tool:pytest]
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov-report=term-missing
    --cov-report=html

