[pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Custom markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may use database/external services)
    slow: Slow tests (skip with -m "not slow")
    e2e: End-to-end tests (full system integration)
    llm: LLM integration tests (require OpenRouter API credits, expensive)

# Warning filters
filterwarnings =
    # Ignore SQLAlchemy transaction warnings during test rollback
    ignore::sqlalchemy.exc.SAWarning
    # Ignore httpx cookie deprecation (httpx internal behavior)
    ignore:Setting per-request cookies=:DeprecationWarning:httpx
    # Ignore FastAPI/Starlette HTTP status constant deprecations
    ignore:'HTTP_422_UNPROCESSABLE_ENTITY' is deprecated:DeprecationWarning:starlette
    ignore:'HTTP_413_REQUEST_ENTITY_TOO_LARGE' is deprecated:DeprecationWarning:fastapi
    # Ignore Pydantic v2 migration warnings (will fix in separate task)
    ignore:The `__fields__` attribute is deprecated:pydantic.warnings.PydanticDeprecatedSince20
    ignore:Support for class-based `config` is deprecated:pydantic.warnings.PydanticDeprecatedSince20
    # Ignore Sentry SDK deprecation (will upgrade when ready)
    ignore:`sentry_sdk.Hub` is deprecated.*:DeprecationWarning

# Coverage settings
[coverage:run]
source = src
omit =
    */tests/*
    */migrations/*
    */__pycache__/*

[coverage:report]
# Target: 70%+ for critical paths
precision = 2
show_missing = True
skip_covered = False

# Exclude lines from coverage
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

# Output options
[tool:pytest]
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov-report=term-missing
    --cov-report=html

