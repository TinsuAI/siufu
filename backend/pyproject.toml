[project]
name = "siufu-backend"
version = "1.0.0"
description = "Backend API for Siufu - Customs Declaration Automation Platform"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "B008",  # FastAPI Depends() in defaults is standard pattern
    "E501",  # Line too long - let Black/formatter handle
    "B017",  # pytest.raises(Exception) is acceptable in tests
    "B904",  # Exception chaining with 'from' is optional
    "B007",  # Unused loop variable is acceptable
    "E402",  # Module-level imports after code (needed for some configs)
    "F821",  # Forward reference in TYPE_CHECKING blocks
    "E712",  # Boolean comparison with == is acceptable with SQLAlchemy
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
