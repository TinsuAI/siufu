notes: |
  Frontend Vitest suites (19 files / 278 tests) now pass consistently, resolving the failures highlighted in the previous gate. The remaining gaps are purely functional: verified badges never light up because importer/exporter IDs are not surfaced, and the Companies page omits the Edit/Merge affordances promised in the story.
  Once those issues are addressed and the heavier backend/E2E suites are re-run, this story should be ready for a PASS decision.
