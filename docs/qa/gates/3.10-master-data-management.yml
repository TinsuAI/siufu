# Quality Gate Decision for Story 3.10: Master Data Management

schema: 1
story: "3.10"
story_title: "Master Data Management for Importers & Exporters"
gate: CONCERNS
status_reason: "Key UX requirements remain unmet: verified company badges never surface and the Companies cards lack the required Edit/Merge actions."
reviewer: "Quinn (Test Architect)"
updated: "2025-11-09T00:55:34Z"

waiver: { active: false }

top_issues:
  - id: "UI-VERIFIED-BADGE"
    severity: medium
    finding: "The declaration API never exposes importer_id/exporter_id and the review page does not pass those fields to CompanyBadge, so the UI always shows the 'New Company' warning even when master data matches."
    suggested_action: "Include importer/exporter identifiers (and optional declaration counts) in GET /api/declarations/{id}, extend the TS types, and feed those values through DeclarationReviewPage into CompanyBadge."
    suggested_owner: dev
    refs:
      - "backend/src/api/v1/declarations.py:526-542"
      - "frontend/src/types/declaration.ts:420-431"
      - "frontend/src/app/declarations/[id]/review/page.tsx:334-342"
      - "frontend/src/components/declarations/declaration-form-v2.tsx:535-544"
  - id: "UI-COMPANY-ACTIONS"
    severity: medium
    finding: "Company cards only offer View+Delete actions even though the spec mandates View, Edit, Merge, and Delete, leaving no direct entry point to merge duplicates or jump straight into edit mode."
    suggested_action: "Add the missing Edit (can route to the detail page in edit mode) and Merge (link to /companies/merge pre-selecting the company) buttons on each card."
    suggested_owner: dev
    refs:
      - "docs/stories/3.10.master-data-management.story.md:188-209"
      - "frontend/src/app/companies/page.tsx:120-185"

