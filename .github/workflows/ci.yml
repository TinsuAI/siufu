name: CI Pipeline

on:
  push:
    branches: [main, develop, focus-attempt]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password_123
          POSTGRES_DB: customs_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Install Python dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linter (Ruff)
        working-directory: ./backend
        run: |
          ruff check src/ tests/
        continue-on-error: false

      - name: Run type checker (mypy)
        working-directory: ./backend
        run: |
          mypy src/
        continue-on-error: true  # Don't fail CI on type errors yet

      - name: Run backend tests with coverage
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test_password_123@localhost:5432/customs_db_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: test
        run: |
          pytest tests/ -m "not e2e and not llm" --cov=src --cov-report=xml --cov-report=term-missing -v --tb=short
        continue-on-error: false  # Fail CI if tests fail

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: always()

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: |
            backend/coverage.xml
            backend/htmlcov/
          retention-days: 30
        if: always()

  frontend-tests:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run linter (ESLint)
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: false

      - name: Run type checker (TypeScript)
        working-directory: ./frontend
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test -- --run --coverage
        continue-on-error: false

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        continue-on-error: false

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 30
        if: always()

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: customs-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: customs-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test docker-compose configuration
        run: |
          docker compose config

  # Deploy to production (only on main branch after all tests pass)
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, docker-build]
    # Only deploy on main branch (not on PRs or other branches)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: https://siufu.tinsu.ai
      # API URL: https://api.siufu.tinsu.ai

    env:
      DEPLOYMENT_PATH: /home/${{ secrets.SSH_USER }}/logai-production
      COMPOSE_PROJECT_NAME: siufu

    steps:
      - name: Debug deployment trigger
        run: |
          echo "Branch: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"
          echo "Commit: ${{ github.sha }}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          # Decode base64-encoded SSH key
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Debug: Show what we got (first and last lines only, no sensitive content)
          echo "=== DEBUG: Key file first line ==="
          head -n 1 ~/.ssh/deploy_key
          echo "=== DEBUG: Key file last line ==="
          tail -n 1 ~/.ssh/deploy_key
          echo "=== DEBUG: Line count ==="
          wc -l ~/.ssh/deploy_key

          # Verify the key file was created correctly
          if ! grep -q "BEGIN.*PRIVATE KEY" ~/.ssh/deploy_key; then
            echo "ERROR: SSH private key file does not contain a valid key header"
            echo "Full file content (this will help debug):"
            cat ~/.ssh/deploy_key
            exit 1
          fi

          # Check if file contains public key line (it shouldn't)
          if grep -q "^ssh-ed25519\|^ssh-rsa" ~/.ssh/deploy_key; then
            echo "ERROR: Private key file contains public key line. It should ONLY contain the private key."
            echo "Lines containing public key:"
            grep "^ssh-ed25519\|^ssh-rsa" ~/.ssh/deploy_key
            exit 1
          fi

          echo "SSH key file created successfully"

          # Add known hosts to avoid host verification prompt
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo 'SSH connection successful'"

      - name: Create deployment directory structure
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            # Create main deployment directory
            mkdir -p ${{ env.DEPLOYMENT_PATH }}
            mkdir -p ${{ env.DEPLOYMENT_PATH }}/secrets
            mkdir -p ${{ env.DEPLOYMENT_PATH }}/backups

            # Create backup of current .env if exists
            if [ -f ${{ env.DEPLOYMENT_PATH }}/.env ]; then
              cp ${{ env.DEPLOYMENT_PATH }}/.env ${{ env.DEPLOYMENT_PATH }}/backups/.env.backup.$(date +%Y%m%d_%H%M%S)
            fi
          ENDSSH

      - name: Upload GCP Service Account Key
        run: |
          echo "${{ secrets.GCP_SA_KEY_JSON }}" | ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cat > ${{ env.DEPLOYMENT_PATH }}/secrets/gcp-sa-key.json && chmod 600 ${{ env.DEPLOYMENT_PATH }}/secrets/gcp-sa-key.json"

      - name: Create production .env file
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            cat > ${{ env.DEPLOYMENT_PATH }}/.env << 'EOF'
          # Database Configuration
          POSTGRES_DB=customs_db
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL=postgresql+asyncpg://postgres:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/customs_db

          # Redis Configuration
          REDIS_URL=redis://redis:6379/0
          CELERY_BROKER_URL=redis://redis:6379/0

          # Authentication & Security
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          JWT_ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_HOURS=8

          # CORS Configuration
          CORS_ORIGINS=https://siufu.tinsu.ai,https://api.siufu.tinsu.ai,http://tinxudev.airplane-manta.ts.net:8779

          # External API Keys
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_CLOUD_PROJECT_ID=${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION=${{ secrets.GOOGLE_CLOUD_LOCATION }}
          GOOGLE_CLOUD_PROCESSOR_ID=${{ secrets.GOOGLE_CLOUD_PROCESSOR_ID }}

          # Monitoring
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}

          # Frontend Configuration (uses dedicated API subdomain)
          NEXT_PUBLIC_API_URL=https://api.siufu.tinsu.ai
          EOF
          ENDSSH

      - name: Ensure rsync is installed on remote server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            # Check if rsync is installed
            if ! command -v rsync &> /dev/null; then
              echo "rsync not found, installing..."
              # Update package list and install rsync
              sudo apt-get update -qq
              sudo apt-get install -y rsync
              echo "rsync installed successfully"
            else
              echo "rsync is already installed"
              rsync --version | head -n 1
            fi
          ENDSSH

      - name: Sync application files to server
        run: |
          # Use rsync to transfer files efficiently, excluding unnecessary directories
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='test-results' \
            --exclude='playwright-report' \
            --exclude='backend/venv' \
            --exclude='frontend/.next' \
            --exclude='backend/htmlcov' \
            --exclude='.env' \
            --exclude='secrets' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOYMENT_PATH }}/

      - name: Pull latest images and deploy
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            set -ex  # Exit on error and print commands
            cd ${{ env.DEPLOYMENT_PATH }}

            # Log deployment start
            echo "[$(date)] Starting deployment - Commit: ${{ github.sha }}" >> deployment.log
            echo ">>> Starting deployment process"

            # Pull latest base images to ensure we have updates
            echo ">>> Pulling base images..."
            echo "[$(date)] Pulling base images..." >> deployment.log
            if docker compose -f docker-compose.prod.yml pull postgres redis 2>&1 | tee -a deployment.log; then
              echo "[$(date)] Base images pulled successfully" >> deployment.log
            else
              echo "[$(date)] Failed to pull base images" >> deployment.log
              exit 1
            fi

            # Bring down existing containers
            echo ">>> Stopping existing containers..."
            echo "[$(date)] Stopping existing containers..." >> deployment.log
            docker compose -f docker-compose.prod.yml down 2>&1 | tee -a deployment.log

            # Build and start all services with latest code (production configuration)
            echo ">>> Building and starting services..."
            echo "[$(date)] Building and starting services with production config..." >> deployment.log
            if docker compose -f docker-compose.prod.yml up -d --build 2>&1 | tee -a deployment.log; then
              echo "[$(date)] Services started successfully" >> deployment.log
            else
              echo "[$(date)] Failed to start services" >> deployment.log
              docker compose -f docker-compose.prod.yml logs >> deployment.log
              exit 1
            fi

            # Wait for services to be healthy
            echo "[$(date)] Waiting for services to become healthy..." >> deployment.log
            sleep 15

            echo "[$(date)] Deployment completed" >> deployment.log
          ENDSSH

      - name: Show deployment log on failure
        if: failure()
        run: |
          echo "=== Deployment failed, showing deployment.log ==="
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            cd ${{ env.DEPLOYMENT_PATH }}
            if [ -f deployment.log ]; then
              echo "=== Last 100 lines of deployment.log ==="
              tail -n 100 deployment.log
            else
              echo "deployment.log not found"
            fi

            echo ""
            echo "=== Docker Compose Status ==="
            docker compose -f docker-compose.prod.yml ps || echo "Could not get docker compose status"

            echo ""
            echo "=== Recent Docker Logs ==="
            docker compose -f docker-compose.prod.yml logs --tail=50 || echo "Could not get docker logs"
          ENDSSH

      - name: Run database migrations
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            cd ${{ env.DEPLOYMENT_PATH }}

            echo "[$(date)] Running database migrations..." >> deployment.log
            docker compose -f docker-compose.prod.yml exec -T backend alembic upgrade head

            if [ $? -eq 0 ]; then
              echo "[$(date)] Migrations completed successfully" >> deployment.log
            else
              echo "[$(date)] Migration failed!" >> deployment.log
              exit 1
            fi
          ENDSSH

      - name: Health check
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            cd ${{ env.DEPLOYMENT_PATH }}

            echo "[$(date)] Running health checks..." >> deployment.log

            # Wait for backend to be ready (max 60 seconds)
            for i in {1..12}; do
              if docker compose -f docker-compose.prod.yml exec -T backend curl -f http://localhost:8000/health > /dev/null 2>&1; then
                echo "[$(date)] Backend health check passed" >> deployment.log
                break
              fi
              if [ $i -eq 12 ]; then
                echo "[$(date)] Backend health check failed!" >> deployment.log
                docker compose -f docker-compose.prod.yml logs backend >> deployment.log
                exit 1
              fi
              echo "[$(date)] Waiting for backend to be ready... ($i/12)" >> deployment.log
              sleep 5
            done

            # Check all containers are running (using proper filter for running state)
            # Count only containers with State=running
            RUNNING_COUNT=$(docker compose -f docker-compose.prod.yml ps --filter "status=running" --format "{{.Name}}" | wc -l)
            EXPECTED_COUNT=5

            echo "[$(date)] Container status check: ${RUNNING_COUNT}/${EXPECTED_COUNT} containers running" >> deployment.log

            if [ "$RUNNING_COUNT" -eq "$EXPECTED_COUNT" ]; then
              echo "[$(date)] All ${EXPECTED_COUNT} containers are running successfully" >> deployment.log
            else
              echo "[$(date)] ERROR: Only ${RUNNING_COUNT}/${EXPECTED_COUNT} containers are running!" >> deployment.log
              echo "[$(date)] Container status details:" >> deployment.log
              docker compose -f docker-compose.prod.yml ps >> deployment.log

              # Show which specific containers are not running
              echo "[$(date)] Expected containers: postgres, redis, backend, celery-worker, frontend" >> deployment.log
              echo "[$(date)] Running containers:" >> deployment.log
              docker compose -f docker-compose.prod.yml ps --filter "status=running" --format "  - {{.Name}} ({{.Status}})" >> deployment.log

              echo "[$(date)] Non-running containers:" >> deployment.log
              docker compose -f docker-compose.prod.yml ps --format "  - {{.Name}} ({{.Status}}) [{{.State}}]" | grep -v "running" >> deployment.log || echo "  (none found - this may indicate a different issue)" >> deployment.log

              exit 1
            fi
          ENDSSH

      - name: Show deployment status
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            cd ${{ env.DEPLOYMENT_PATH }}

            echo "=== Container Status ==="
            docker compose -f docker-compose.prod.yml ps

            echo ""
            echo "=== Recent Logs ==="
            docker compose -f docker-compose.prod.yml logs --tail=20

            echo ""
            echo "=== Deployment Log (last 10 lines) ==="
            tail -n 10 deployment.log
          ENDSSH

      - name: Cleanup on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            cd ${{ env.DEPLOYMENT_PATH }}

            echo "[$(date)] Deployment failed, checking for previous backup..." >> deployment.log

            # If deployment fails and there's a backup, we could implement rollback here
            # For now, just log the failure
            echo "[$(date)] Manual intervention required" >> deployment.log

            # Show logs for debugging
            docker compose -f docker-compose.prod.yml logs --tail=50 >> deployment.log
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key

      - name: Deployment Success Notification
        if: success()
        run: |
          echo "Deployment to https://siufu.tinsu.ai completed successfully!"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Deployed by: ${{ github.actor }}"
