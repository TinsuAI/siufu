name: Manual Deploy to Production

on:
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment (skips CI checks - emergency only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

env:
  DEPLOYMENT_PATH: /home/${{ secrets.SSH_USER }}/logai-production
  COMPOSE_PROJECT_NAME: siufu

jobs:
  deploy:
    name: Deploy to Ubuntu Server
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://siufu.tinsu.ai
      # API URL: https://siufu-api.tinsu.ai

    steps:
      - name: Debug workflow trigger
        run: |
          echo "Manual deployment triggered"
          echo "Force deploy: ${{ github.event.inputs.force_deploy }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo 'SSH connection successful'"

      - name: Create deployment directory structure
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            # Create main deployment directory
            mkdir -p ${{ env.DEPLOYMENT_PATH }}
            mkdir -p ${{ env.DEPLOYMENT_PATH }}/secrets
            mkdir -p ${{ env.DEPLOYMENT_PATH }}/backups

            # Create backup of current .env if exists
            if [ -f ${{ env.DEPLOYMENT_PATH }}/.env ]; then
              cp ${{ env.DEPLOYMENT_PATH }}/.env ${{ env.DEPLOYMENT_PATH }}/backups/.env.backup.$(date +%Y%m%d_%H%M%S)
            fi
          ENDSSH

      - name: Validate GitHub Secret Format
        run: |
          echo "=== Pre-flight: Validating GitHub Secret Format ==="

          # Validate that the GitHub secret is proper JSON
          python3 << 'PYEOF'
          import json
          import sys
          import os

          secret = """${{ secrets.GCP_SA_KEY_JSON }}"""

          try:
              # Try to parse as JSON
              creds = json.loads(secret)

              # Check for required fields
              required_fields = ['type', 'project_id', 'private_key', 'client_email']
              missing = [f for f in required_fields if f not in creds]

              if missing:
                  print(f"✗ GitHub secret is missing required fields: {', '.join(missing)}")
                  sys.exit(1)

              # Validate it's proper JSON with quotes
              if creds.get('type') != 'service_account':
                  print(f"✗ Invalid type in GitHub secret: {creds.get('type')}")
                  sys.exit(1)

              print("✓ GitHub secret GCP_SA_KEY_JSON is valid JSON")
              print(f"  Project ID: {creds['project_id']}")
              print(f"  Service Account: {creds['client_email']}")

          except json.JSONDecodeError as e:
              print(f"✗ CRITICAL: GitHub secret GCP_SA_KEY_JSON is NOT valid JSON!")
              print(f"  Error: {e}")
              print()
              print("First 200 characters of the secret:")
              print(secret[:200])
              print()
              print("=== HOW TO FIX ===")
              print("1. Go to: https://github.com/${{ github.repository }}/settings/secrets/actions")
              print("2. Edit the secret: GCP_SA_KEY_JSON")
              print("3. The secret MUST be valid JSON with double quotes around all keys and values")
              print("4. Example of CORRECT format:")
              print('   {')
              print('     "type": "service_account",')
              print('     "project_id": "your-project",')
              print('     "private_key": "-----BEGIN PRIVATE KEY-----\\n...",')
              print('     ...')
              print('   }')
              print()
              print("5. WRONG format (missing quotes):")
              print('   {')
              print('     type: service_account,   ← NO QUOTES = WRONG!')
              print('     ...')
              print('   }')
              sys.exit(1)
          PYEOF

      - name: Upload GCP Service Account Key
        run: |
          echo "=== Uploading GCP Secret to Production ==="

          # Check if secret exists and get its length
          SECRET_LENGTH=$(echo "${{ secrets.GCP_SA_KEY_JSON }}" | wc -c)
          echo "GitHub secret length: $SECRET_LENGTH characters"

          # Encode to base64 and show details
          ENCODED=$(echo "${{ secrets.GCP_SA_KEY_JSON }}" | base64 -w 0)
          ENCODED_LENGTH=${#ENCODED}
          echo "Base64 encoded length: $ENCODED_LENGTH characters"
          echo "First 80 chars of base64:"
          echo "$ENCODED" | head -c 80
          echo ""
          echo "Last 80 chars of base64:"
          echo "$ENCODED" | tail -c 80
          echo ""

          # Transfer and decode
          echo "Transferring to production server..."
          echo "$ENCODED" | ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "base64 -d > ${{ env.DEPLOYMENT_PATH }}/secrets/gcp-sa-key.json && chmod 644 ${{ env.DEPLOYMENT_PATH }}/secrets/gcp-sa-key.json"

          echo "✓ Transfer complete"

      - name: Validate GCP Service Account Key
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            echo "=== Validating GCP credentials JSON ==="

            # Show file details
            FILE_PATH="${{ env.DEPLOYMENT_PATH }}/secrets/gcp-sa-key.json"
            echo "File path: $FILE_PATH"
            echo "File size: $(wc -c < $FILE_PATH) bytes"
            echo "File permissions: $(ls -l $FILE_PATH | awk '{print $1, $3, $4}')"
            echo ""

            # Show first 200 characters of the file
            echo "First 200 chars of transferred file:"
            head -c 200 "$FILE_PATH"
            echo ""
            echo ""

            # Show first 5 lines
            echo "First 5 lines of file:"
            head -5 "$FILE_PATH"
            echo ""

            # Try to validate with Python and show detailed error
            echo "Running Python validation..."
            python3 << 'PYEOF'
          import json
          import sys

          try:
              with open('${{ env.DEPLOYMENT_PATH }}/secrets/gcp-sa-key.json', 'r') as f:
                  creds = json.load(f)

              # Validate required fields
              required_fields = ['type', 'project_id', 'private_key_id', 'private_key',
                                'client_email', 'client_id', 'auth_uri', 'token_uri']

              missing_fields = [field for field in required_fields if field not in creds]

              if missing_fields:
                  print(f"✗ Missing required fields: {', '.join(missing_fields)}")
                  sys.exit(1)

              # Validate field types and formats
              if creds.get('type') != 'service_account':
                  print(f"✗ Invalid type: {creds.get('type')} (expected 'service_account')")
                  sys.exit(1)

              if not creds.get('private_key', '').startswith('-----BEGIN PRIVATE KEY-----'):
                  print("✗ Invalid private_key format (should start with '-----BEGIN PRIVATE KEY-----')")
                  sys.exit(1)

              if '\\n' not in creds.get('private_key', ''):
                  print("✗ Invalid private_key format (missing escaped newlines)")
                  sys.exit(1)

              if not creds.get('client_email', '').endswith('.iam.gserviceaccount.com'):
                  print(f"✗ Invalid client_email format: {creds.get('client_email')}")
                  sys.exit(1)

              # Success
              print("✓ GCP credentials JSON is valid")
              print(f"  Project ID: {creds['project_id']}")
              print(f"  Service Account: {creds['client_email']}")
              print(f"  Private Key: {len(creds['private_key'])} characters")

          except json.JSONDecodeError as e:
              print(f"✗ Invalid JSON format: {e}")
              print("This usually means the secret was corrupted during transfer.")
              print("\nShowing raw file content (first 500 chars):")
              with open('${{ env.DEPLOYMENT_PATH }}/secrets/gcp-sa-key.json', 'r') as f:
                  content = f.read(500)
                  print(repr(content))
              print("\n=== Debugging Info ===")
              print("If you see missing quotes or 'n' instead of '\\n', the GitHub secret is malformed.")
              print("The secret should be valid JSON with double quotes around all keys and values.")
              sys.exit(1)
          except FileNotFoundError:
              print("✗ GCP credentials file not found at: ${{ env.DEPLOYMENT_PATH }}/secrets/gcp-sa-key.json")
              sys.exit(1)
          except Exception as e:
              print(f"✗ Validation error: {e}")
              import traceback
              traceback.print_exc()
              sys.exit(1)
          PYEOF
          ENDSSH

      - name: Create production .env file
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            cat > ${{ env.DEPLOYMENT_PATH }}/.env << 'EOF'
          # Database Configuration
          POSTGRES_DB=customs_db
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL=postgresql+asyncpg://postgres:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/customs_db

          # Redis Configuration
          REDIS_URL=redis://redis:6379/0
          CELERY_BROKER_URL=redis://redis:6379/0

          # Authentication & Security
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          JWT_ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_HOURS=8

          # CORS Configuration
          CORS_ORIGINS=https://siufu.tinsu.ai,https://siufu-api.tinsu.ai,http://tinxudev.airplane-manta.ts.net:8779

          # External API Keys
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_CLOUD_PROJECT_ID=${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION=${{ secrets.GOOGLE_CLOUD_LOCATION }}
          GOOGLE_CLOUD_PROCESSOR_ID=${{ secrets.GOOGLE_CLOUD_PROCESSOR_ID }}

          # Monitoring
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}

          # Frontend Configuration (uses dedicated API subdomain with /api/v1 prefix)
          NEXT_PUBLIC_API_URL=https://siufu-api.tinsu.ai/api/v1
          EOF
          ENDSSH

      - name: Sync application files to server
        run: |
          # Use rsync to transfer files efficiently, excluding unnecessary directories
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='test-results' \
            --exclude='playwright-report' \
            --exclude='backend/venv' \
            --exclude='frontend/.next' \
            --exclude='backend/htmlcov' \
            --exclude='.env' \
            --exclude='secrets' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOYMENT_PATH }}/

      - name: Pull latest images and deploy
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            cd ${{ env.DEPLOYMENT_PATH }}

            # Log deployment start
            echo "[$(date)] Starting MANUAL deployment - Commit: ${{ github.sha }}" >> deployment.log
            echo "[$(date)] Triggered by: ${{ github.actor }}" >> deployment.log

            # Pull latest base images to ensure we have updates
            docker compose -f docker-compose.prod.yml pull postgres redis

            # Bring down existing containers
            echo "[$(date)] Stopping existing containers..." >> deployment.log
            docker compose -f docker-compose.prod.yml down

            # Build and start all services with latest code (production configuration)
            echo "[$(date)] Building and starting services with production config..." >> deployment.log
            docker compose -f docker-compose.prod.yml up -d --build

            # Wait for services to be healthy
            echo "[$(date)] Waiting for services to become healthy..." >> deployment.log
            sleep 15

            echo "[$(date)] Deployment completed" >> deployment.log
          ENDSSH

      - name: Run database migrations
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            cd ${{ env.DEPLOYMENT_PATH }}

            echo "[$(date)] Running database migrations..." >> deployment.log
            docker compose -f docker-compose.prod.yml exec -T backend alembic upgrade head

            if [ $? -eq 0 ]; then
              echo "[$(date)] Migrations completed successfully" >> deployment.log
            else
              echo "[$(date)] Migration failed!" >> deployment.log
              exit 1
            fi
          ENDSSH

      - name: Health check
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            cd ${{ env.DEPLOYMENT_PATH }}

            echo "[$(date)] Running health checks..." >> deployment.log

            # Wait for backend to be ready (max 60 seconds)
            for i in {1..12}; do
              if docker compose -f docker-compose.prod.yml exec -T backend curl -f http://localhost:8000/health > /dev/null 2>&1; then
                echo "[$(date)] Backend health check passed" >> deployment.log
                break
              fi
              if [ $i -eq 12 ]; then
                echo "[$(date)] Backend health check failed!" >> deployment.log
                docker compose -f docker-compose.prod.yml logs backend >> deployment.log
                exit 1
              fi
              echo "[$(date)] Waiting for backend to be ready... ($i/12)" >> deployment.log
              sleep 5
            done

            # Check all containers are running (using proper filter for running state)
            # Count only containers with State=running
            RUNNING_COUNT=$(docker compose -f docker-compose.prod.yml ps --filter "status=running" --format "{{.Name}}" | wc -l)
            EXPECTED_COUNT=5

            echo "[$(date)] Container status check: ${RUNNING_COUNT}/${EXPECTED_COUNT} containers running" >> deployment.log

            if [ "$RUNNING_COUNT" -eq "$EXPECTED_COUNT" ]; then
              echo "[$(date)] All ${EXPECTED_COUNT} containers are running successfully" >> deployment.log
            else
              echo "[$(date)] ERROR: Only ${RUNNING_COUNT}/${EXPECTED_COUNT} containers are running!" >> deployment.log
              echo "[$(date)] Container status details:" >> deployment.log
              docker compose -f docker-compose.prod.yml ps >> deployment.log

              # Show which specific containers are not running
              echo "[$(date)] Expected containers: postgres, redis, backend, celery-worker, frontend" >> deployment.log
              echo "[$(date)] Running containers:" >> deployment.log
              docker compose -f docker-compose.prod.yml ps --filter "status=running" --format "  - {{.Name}} ({{.Status}})" >> deployment.log

              echo "[$(date)] Non-running containers:" >> deployment.log
              docker compose -f docker-compose.prod.yml ps --format "  - {{.Name}} ({{.Status}}) [{{.State}}]" | grep -v "running" >> deployment.log || echo "  (none found - this may indicate a different issue)" >> deployment.log

              exit 1
            fi
          ENDSSH

      - name: Show deployment status
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            cd ${{ env.DEPLOYMENT_PATH }}

            echo "=== Container Status ==="
            docker compose -f docker-compose.prod.yml ps

            echo ""
            echo "=== Recent Logs ==="
            docker compose -f docker-compose.prod.yml logs --tail=20

            echo ""
            echo "=== Deployment Log (last 10 lines) ==="
            tail -n 10 deployment.log
          ENDSSH

      - name: Cleanup on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            cd ${{ env.DEPLOYMENT_PATH }}

            echo "[$(date)] Deployment failed, checking for previous backup..." >> deployment.log

            # If deployment fails and there's a backup, we could implement rollback here
            # For now, just log the failure
            echo "[$(date)] Manual intervention required" >> deployment.log

            # Show logs for debugging
            docker compose -f docker-compose.prod.yml logs --tail=50 >> deployment.log
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key

      - name: Deployment Success Notification
        if: success()
        run: |
          echo "Manual deployment to https://siufu.tinsu.ai completed successfully!"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Deployed by: ${{ github.actor }}"
